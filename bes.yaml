# BES: Boundary Embedding Shaping (ICML 2026)
#
# 支持维度: 32, 64, 128, 256, 384, 512, 768
# 支持数据集: ogbn-arxiv, ogbn-products, ogbn-mag
#
# 运行示例:
#   python train_unified_methods.py --config bes.yaml --dataset arxiv --hidden-dim 64
#   python train_unified_methods.py --config bes.yaml --dataset products --hidden-dim 128

default:
  # --- 训练参数 ---
  method: bes
  pretrain_lr: 0.0001            # 低学习率（与原 BES lr=1e-4 一致）
  pretrain_weight_decay: 0.0005  # 与原 BES 一致
  pretrain_epochs: 200
  pretrain_patience: 20
  pretrain_min_delta: 1e-4
  pretrain_eval_every: 1
  pretrain_input: train          # BES 只用训练节点做边界检测
  pretrain_early_stop: false       # BES 分阶段训练，不跨阶段比较 loss 早停

  # --- 模型参数 ---
  hidden_dim: 64                 # 可覆盖为 32/64/128/256/384/512/768
  num_layers: 2
  dropout: 0.5

  # --- BES 特有参数 ---
  bes_tau: 1.0                   # 排斥损失温度
  bes_delta: 5.0                 # Mahalanobis 边界检测阈值
  bes_alpha: 1.0                 # Virtual step 缩放因子
  bes_backbone_epochs: 100       # 双视角 GNN 预训练，之后冻结
  bes_backbone_lr: 0.005         # arxiv GNN backbone 预训练学习率
  bes_num_heads: 2
  bes_attention_layers: 2
  bes_beta_size: 256
  bes_boundary_knn: 5
  bes_covariance_reg: 0.0001
  bes_max_boundary_candidates: 50000  # OGB 大图的显式近似；论文式全量请设 0
  bes_displacement_batch_size: 4096

  # --- 评估参数 ---
  mode: auto
  cls_epochs: 200
  cls_lr: 0.01
  cls_weight_decay: 0.0
  cls_batch_size: 8192
  cls_early_stop: true
  cls_patience: 20
  cls_min_delta: 1e-4
  batch_size: 1024
  eval_batch_size: 4096
  num_neighbors: [15, 10]
  eval_num_neighbors: [-1, -1]
  # --- 资源 ---
  gpu_id: auto
  infer_device: auto
  log_level: INFO


# ============================================================================
# ogbn-arxiv (169K nodes — 全图可载入 GPU, 约 6GB)
# ============================================================================
arxiv:
  pretrain_epochs: 200
  mode: neighbor
  eval_num_neighbors: [30, 20]


# ============================================================================
# ogbn-products (2.4M nodes — 需要 Neighbor 采样)
# ============================================================================
products:
  pretrain_epochs: 20
  bes_backbone_epochs: 10
  mode: neighbor
  batch_size: 4096
  eval_batch_size: 2048
  num_neighbors: [10, 5]
  eval_num_neighbors: [20, 10]


# ============================================================================
# ogbn-mag (heterogeneous — paper 子图, 需要 Neighbor 采样)
# ============================================================================
mag:
  pretrain_epochs: 50
  bes_backbone_epochs: 25
  mode: neighbor
  batch_size: 4096
  eval_batch_size: 2048
  num_neighbors: [10, 5]
  eval_num_neighbors: [20, 10]
