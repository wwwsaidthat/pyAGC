# lrGAE: left-right Graph Auto-Encoder
# Li et al., "Revisiting and Benchmarking Graph Autoencoders"
#
# 单维度:
#   python train_unified_methods.py --config lrgae.yaml --method lrgae \
#     --dataset arxiv --hidden-dim 128
#
# 七个维度依次独立训练:
#   python train_unified_methods.py --config lrgae.yaml --method lrgae \
#     --dataset arxiv --run-dims 32,64,128,256,384,512,768

default:
  method: lrgae

  # 官方 node-classification lrGAE-vu 的核心设置。
  num_layers: 2
  hidden_dim: 128
  dropout: 0.8
  lrgae_variant: 8
  lrgae_mask_ratio: 0.7
  lrgae_decoder_dim: 32
  lrgae_decoder_layers: 2
  lrgae_decoder_dropout: 0.2
  lrgae_decoder_batch_size: 131072
  lrgae_grad_norm: 1.0
  neg_ratio: 1.0

  pretrain_lr: 0.01
  pretrain_weight_decay: 0.00005
  pretrain_epochs: 500
  pretrain_input: all
  pretrain_early_stop: false
  amp: false

  # 冻结编码器后训练线性分类器。
  cls_epochs: 200
  cls_lr: 0.01
  cls_weight_decay: 0.00005
  cls_batch_size: 8192
  cls_early_stop: true
  cls_patience: 20
  cls_min_delta: 0.0001

  gpu_id: auto
  infer_device: auto
  log_level: INFO

arxiv:
  # 官方目标依赖全局真边排除负样本；arxiv 在常见 24GB GPU 上可全图训练。
  mode: full
  eval_batch_size: 4096

products:
  mode: neighbor
  batch_size: 4096
  eval_batch_size: 2048
  num_neighbors: [10, 5]
  eval_num_neighbors: [-1, -1]
  neg_ratio: 0.5

mag:
  mode: neighbor
  batch_size: 4096
  eval_batch_size: 2048
  num_neighbors: [10, 5]
  eval_num_neighbors: [-1, -1]
  neg_ratio: 0.5
