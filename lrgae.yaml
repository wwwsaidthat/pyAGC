# LRGAE: Low-Rank Graph Auto-Encoder
#
# 在标准 GAE 的基础上，将重建目标从二值邻接矩阵替换为
# 截断 SVD 低秩去噪版本，提供更干净的训练信号。
#
# 支持维度: 32, 64, 128, 256, 384, 512, 768
# 支持数据集: ogbn-arxiv, ogbn-products, ogbn-mag
#
# 运行示例:
#   python train_unified_methods.py --method lrgae --dataset arxiv --hidden-dim 64
#   python train_unified_methods.py --method lrgae --dataset products --hidden-dim 128

default:
  # --- 训练参数 ---
  method: lrgae
  pretrain_lr: 0.001
  pretrain_weight_decay: 0.0
  pretrain_epochs: 200
  pretrain_patience: 20
  pretrain_min_delta: 1e-4
  pretrain_eval_every: 1
  pretrain_input: all              # lrGAE 用所有节点做边重建
  pretrain_early_stop: true

  # --- 模型参数 ---
  hidden_dim: 64
  num_layers: 2
  dropout: 0.5

  # --- LRGAE 特有参数 ---
  lrgae_rank: 64                   # SVD 截断秩，默认 = hidden_dim
  neg_ratio: 1.0                   # 负边比例，大图建议 0.25--0.5
  amp: false                       # 自动混合精度

  # --- 评估参数 ---
  mode: auto
  cls_epochs: 200
  cls_lr: 0.01
  cls_weight_decay: 0.0
  cls_batch_size: 8192
  cls_early_stop: true
  cls_patience: 20
  cls_min_delta: 1e-4
  batch_size: 1024
  eval_batch_size: 4096
  num_neighbors: [15, 10]
  eval_num_neighbors: [-1, -1]
  eval_seeds: [0, 1, 2, 3, 4]

  # --- 资源 ---
  gpu_id: auto
  infer_device: auto
  log_level: INFO


# ============================================================================
# ogbn-arxiv (169K nodes — 全图可载入 GPU, 约 6GB)
# ============================================================================
arxiv:
  pretrain_epochs: 200
  mode: neighbor


# ============================================================================
# ogbn-products (2.4M nodes — 需要 Neighbor 采样)
# ============================================================================
products:
  pretrain_epochs: 20
  mode: neighbor
  batch_size: 4096
  eval_batch_size: 2048
  num_neighbors: [10, 5]
  eval_num_neighbors: [-1, -1]
  neg_ratio: 0.5                   # 大图降低负采样比例节省显存


# ============================================================================
# ogbn-mag (heterogeneous — paper 子图, 需要 Neighbor 采样)
# ============================================================================
mag:
  pretrain_epochs: 50
  mode: neighbor
  batch_size: 4096
  eval_batch_size: 2048
  num_neighbors: [10, 5]
  eval_num_neighbors: [-1, -1]
  neg_ratio: 0.5
